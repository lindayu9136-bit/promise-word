  <style>
    :root { --themeBg:#a595c8; --mainFont:#3d2b29; }

    body{
      background-color:var(--themeBg);
      color:var(--mainFont);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-synthesis: none;

      overscroll-behavior-y:none;
      user-select:none;
      overflow-x:hidden;
    }
    ::-webkit-scrollbar{ display:none; }

    h1,h2,h3{ font-family:"Noto Serif KR", serif; }
    .bible-text{ font-family:"Gowun Batang", serif; }
    .break-keep{ word-break: keep-all; }

    /* ✅ 공통 Glass Card (알파 0.15 / 블러 15px) */
    .glass-card{
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 24px -12px rgba(40, 30, 45, 0.10);
    }
    .list-item-shadow{ box-shadow: 0 2px 12px -4px rgba(40, 30, 45, 0.06); }

    /* ✅ 성경본문 카드 그림자 퍼짐 줄이기(존재감만 남기기) */
    .study-card-shadow{
      box-shadow:
        0 14px 28px -26px rgba(40, 30, 45, 0.20),
        0 10px 20px -24px rgba(40, 30, 45, 0.16);
    }

    /* ✅ 퀴즈 시작 버튼 */
    .btn-primary{
      background: linear-gradient(
        135deg,
        rgba(122, 103, 95, 0.34) 0%,
        rgba(122, 103, 95, 0.22) 100%
      );
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        0 8px 16px -14px rgba(40, 30, 45, 0.18),
        0 6px 12px -12px rgba(122, 103, 95, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.26);
      color: rgba(61, 43, 41, 0.92);
    }

    /* [핵심] 눌림(Press) 상태 스타일 */
    .is-pressing{
      transform: translateY(1px) scale(0.985) !important;
      filter: brightness(0.96) !important;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.05) !important;
    }
    .clickable-element{
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1),
                  filter 0.15s ease,
                  box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .screen{ display:none; }
    .screen.active{ display:flex; flex-direction:column; }

    .title-vivid{
      text-shadow: 0 0.8px 1.5px rgba(0,0,0,0.12);
      filter: contrast(1.11);
    }

    /* =========================
       HOME Garden (식물 애니메이션)
       ========================= */
    #garden-wrap{ width:100%; }
    .garden{ width: min(420px, 96vw); height:auto; display:block; }

    .garden{
      --stemGreen: rgba(46, 98, 74, .86);
      --baseLeafGreen: rgba(46, 98, 74, .82);
    }

    .garden .soil{
      fill:none;
      stroke: rgba(60, 42, 36, .10);
      stroke-width: 4.6;
      stroke-linecap: round;
    }

    .garden .stem{
      stroke: var(--stemGreen);
      stroke-width: 2.9;
      fill:none;
      stroke-linecap: round;
    }

    .garden .leaf{ fill: var(--leaf-color); }
    .garden .petal{ fill: var(--petal-color); }
    .garden .center{ fill: rgba(248, 246, 242, .92); }
    .garden .flowerleaf{ fill: var(--baseLeafGreen); }

    .garden .plant{
      opacity: 0;
      transform: translate(var(--x), var(--y)) translateY(28px) scale(0);
      transform-origin: 0px 150px;
      will-change: transform, opacity;
    }

    /* ✅ 흙선만 보이는 시간 단축: 딜레이 1.55s → 1.25s */
    #garden-wrap.play .garden .plant{
      animation: plantRiseSmooth 3.6s cubic-bezier(0.22, 0.90, 0.18, 1.00) 1.25s forwards;
    }

    @keyframes plantRiseSmooth{
      from{
        opacity: 0;
        transform: translate(var(--x), var(--y)) translateY(28px) scale(0);
      }
      to{
        opacity: 1;
        transform: translate(var(--x), var(--y)) translateY(0px) scale(1);
      }
    }

    /* =========================
       QUIZ UI
       ========================= */

    /* 프로그레스 라인 */
    .quiz-progress-rail{
      height: 2px;
      background: rgba(255,255,255,0.20);
      border-radius: 999px;
      overflow: hidden;
    }
    .quiz-progress-bar{
      height: 100%;
      width: 0%;
      background: rgba(61,43,41,0.40);
      transition: width 120ms ease;
      border-radius: 999px;
    }

    /* ✅ 빈칸(선택 전): 고급 톤 회백 라벤더(탁하지 않게) + inset */
    .quiz-blank{
      display: inline-flex;
      align-items: center;
      justify-content: center;

      height: 1.10em;
      min-width: 2.45em;
      padding: 0 0.60em;

      margin: 0 0.06em;
      border-radius: 999px;

      /* 한 단계 더 고급: 약간 쿨/실키, 탁함 없이 눌러줌 */
      background: rgba(190, 188, 214, 0.88);

      border: none;

      /* inset을 조금 더 실키하게(탁해지지 않게 대비 낮춤) */
      box-shadow:
        inset 0 1px 2px rgba(61,43,41,0.11),
        inset 0 -1px 0 rgba(255,255,255,0.16);

      color: rgba(61,43,41,0.92);
      font-weight: 900;
      letter-spacing: -0.01em;

      vertical-align: baseline;
      transform: translateY(0.05em);
      line-height: 1;
    }

    /* ✅ Active 빈칸: 링 페이드가 너무 빨라서 180ms로 숨 늘림 */
    .quiz-blank.is-active{
      animation: activeRingFade 180ms ease-out both;
      box-shadow:
        inset 0 1px 2px rgba(61,43,41,0.11),
        inset 0 -1px 0 rgba(255,255,255,0.16),
        0 0 0 1px rgba(61,43,41,0.18);
    }
    @keyframes activeRingFade{
      from{ box-shadow:
        inset 0 1px 2px rgba(61,43,41,0.11),
        inset 0 -1px 0 rgba(255,255,255,0.16),
        0 0 0 1px rgba(61,43,41,0.00);
      }
      to{ box-shadow:
        inset 0 1px 2px rgba(61,43,41,0.11),
        inset 0 -1px 0 rgba(255,255,255,0.16),
        0 0 0 1px rgba(61,43,41,0.18);
      }
    }

    /* 정답 선택 후 빈칸: 학습 본문처럼 "아무것도 없음" */
    .quiz-blank.is-filled{
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      min-width: 0;
      height: auto;
      border-radius: 0;
      transform: none;
    }

    /* 선택지(풀) */
    .choice-btn{
      width: 100%;
      text-align: center;
      padding: 16px 14px;
      border-radius: 22px;

      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 10px 22px -18px rgba(40, 30, 45, 0.22);

      color: rgba(61,43,41,0.92);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .choice-label{
      font-family:"Noto Serif KR", serif;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 18px;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    /* 오답 디밍: 그 오답만 */
    .choice-btn.is-dimmed{
      opacity: 0.38;
      filter: grayscale(0.35);
    }

    /* ✅ 정답 효과(2개): 미세 inset + soft highlight 120ms */
    .choice-btn.is-correct{
      animation: correctSettle 120ms ease-out both;
      box-shadow:
        inset 0 2px 8px rgba(61,43,41,0.16),
        inset 0 -1px 0 rgba(255,255,255,0.26),
        0 10px 22px -18px rgba(40, 30, 45, 0.22);
    }
    @keyframes correctSettle{
      from{ transform: scale(1); filter: brightness(1); }
      to{ transform: scale(0.992); filter: brightness(1.02); }
    }
    .choice-btn.is-correct::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(120px 60px at 50% 40%, rgba(255,255,255,0.22), rgba(255,255,255,0.00) 65%);
      opacity: 0;
      animation: softGlow 120ms ease-out forwards;
      z-index:1;
      pointer-events:none;
    }
    @keyframes softGlow{
      from{ opacity: 0; }
      to{ opacity: 1; }
    }

    /* ✅ 완료 시 선택지 영역 “접어서 사라지기” */
    #quiz-choice-area{
      transform-origin: top;
      transition: max-height 120ms ease, opacity 120ms ease, transform 120ms ease;
      max-height: 220px;
      opacity: 1;
      transform: translateY(0);
    }
    #quiz-choice-area.is-collapsed{
      max-height: 0px;
      opacity: 0;
      transform: translateY(-6px);
      overflow: hidden;
      pointer-events: none;
    }
  </style>

  <script>
    const BIBLE_VERSES = [
      { id: "salvation", topic: "구원의 확신", reference: "요한일서 5:11-12", content: "또 증거는 이것이니\n하나님이 우리에게\n영생을 주신 것과\n이 생명이 그의 아들 안에\n있는 그것이니라\n아들이 있는 자에게는\n생명이 있고\n하나님의 아들이\n없는 자에게는\n생명이 없느니라", description: "영원한 생명의 약속" },
      { id: "prayer", topic: "기도 응답의 확신", reference: "요한복음 16:24", content: "지금까지는 너희가\n내 이름으로\n아무 것도 구하지\n아니하였으나\n구하라 그리하면 받으리니\n너희 기쁨이 충만하리라", description: "예수님의 이름으로 구하는 기쁨" },
      { id: "victory", topic: "승리의 확신", reference: "고린도전서 10:13", content: "사람이 감당할\n시험 밖에는\n너희가 당한 것이 없나니\n오직 하나님은 미쁘사\n너희가 감당하지 못할\n시험 당함을\n허락하지 아니하시고\n시험 당할 즈음에\n또한 피할 길을 내사\n너희로 능히\n감당하게 하시느니라", description: "피할 길을 내시는 하나님" },
      { id: "forgiveness", topic: "사죄의 확신", reference: "요한일서 1:9", content: "만일 우리가\n우리 죄를 자백하면\n그는 미쁘시고 의로우사\n우리 죄를 사하시며\n우리를 모든 불의에서\n깨끗하게 하실 것이요", description: "사죄와 정결의 은혜" },
      { id: "guidance", topic: "인도의 확신", reference: "잠언 3:5-6", content: "너는 마음을 다하여\n여호와를 신뢰하고\n네 명철을\n의지하지 말라\n너는 범사에 그를 인정하라\n그리하면 네 길을\n지도하시리라", description: "길을 지도하시리라" }
    ];

    let currentVerse = null;

    function performAction(element, callback) {
      if (element.classList.contains("is-pressing")) return;
      element.classList.add("is-pressing");
      setTimeout(() => {
        element.classList.remove("is-pressing");
        setTimeout(() => callback(), 85);
      }, 120);
    }

    function navigateTo(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add("active");
        window.scrollTo(0, 0);
        lucide.createIcons();
        if (screenId === "screen-intro") restartGardenAnim();
      }
    }

    function initNavigation() {
      document.querySelectorAll(".clickable-action").forEach(btn => {
        btn.addEventListener("click", function () {
          const next = this.getAttribute("data-next");
          performAction(this, () => navigateTo(next));
        });
      });

      document.querySelectorAll(".nav-back").forEach(btn => {
        btn.addEventListener("click", function () {
          const to = this.getAttribute("data-to");
          if (to) performAction(this, () => navigateTo(to));
        });
      });
    }

    function initTopics() {
      const list = document.getElementById("topic-list");
      if (!list) return;
      list.innerHTML = "";

      BIBLE_VERSES.forEach((verse, index) => {
        const card = document.createElement("button");
        card.className =
          "topic-card clickable-element w-full group glass-card p-6 rounded-[2.2rem] flex items-center justify-between text-left relative overflow-hidden list-item-shadow border-white/10";
        card.innerHTML = `
          <div class="flex items-center space-x-6 relative z-10 flex-1">
            <span class="text-[20px] font-classic font-black text-mainFont/45 tabular-nums tracking-tight transition-colors">0${index + 1}</span>

              <h3 class="text-[22px] font-classic font-bold text-mainFont tracking-tight transition-colors truncate">${escapeHTML(verse.topic)}</h3>
              <p class="text-[13px] text-mainFont/40 font-sans font-bold tracking-wider uppercase mt-0.5">${escapeHTML(verse.reference)}</p>
            </div>
          </div>
          <div class="bg-white/15 p-3 rounded-full flex-shrink-0 border border-white/20">
            <i data-lucide="chevron-right" class="text-mainFont/30" size="18"></i>
          </div>
        `;

        card.addEventListener("click", function () {
          performAction(this, () => {
            currentVerse = verse;
            renderStudy();
            navigateTo("screen-study");
          });
        });

        list.appendChild(card);
      });
    }

    function renderStudy() {
      const study = document.getElementById("screen-study");
      if (!study) return;

      study.innerHTML = `
        <div class="mb-2">
          <button class="nav-back clickable-element flex items-center space-x-1 text-mainFont/40 py-3 px-1" onclick="performAction(this, () => navigateTo('screen-topics'))">
            <i data-lucide="chevron-left" size="18"></i>
            <span class="text-[13px] font-sans font-bold tracking-widest">돌아가기</span>
          </button>
        </div>

        <div class="flex-1 flex flex-col">
          <div class="text-center mb-7">
            <h2 class="text-[30px] font-classic font-bold text-mainFont tracking-tight">${escapeHTML(currentVerse.topic)}</h2>
          </div>

          <div class="relative p-10 glass-card rounded-[3.5rem] border border-white/40 study-card-shadow flex flex-col justify-center items-center min-h-[440px]">
            <p class="text-[1.7rem] font-serif font-bold leading-[1.9] text-mainFont whitespace-pre-line text-center break-keep">
              ${escapeHTML(currentVerse.content)}
            </p>
            <p class="mt-10 text-[19px] font-serif font-bold text-mainFont">${escapeHTML(currentVerse.reference)}</p>
          </div>
        </div>

        <div class="mt-10 pb-8 w-full">
          <button class="clickable-element w-full btn-primary py-5 rounded-[1.8rem] flex items-center justify-center"
                  onclick="performAction(this, () => { startQuiz(); navigateTo('screen-quiz'); })">
            <span class="text-[19px] font-classic font-bold text-mainFont tracking-tight">퀴즈 시작</span>
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    function restartGardenAnim() {
      const wrap = document.getElementById("garden-wrap");
      if (!wrap) return;
      wrap.classList.remove("play");
      void wrap.offsetWidth;
      wrap.classList.add("play");
    }

    /* =========================
       QUIZ
       ========================= */
    let quiz = null;

    function startQuiz(){
      quiz = buildQuizFromVerse(currentVerse, 10);
      renderQuiz();
    }

    function buildQuizFromVerse(verse, blankCount){
      const lines = verse.content.split("\n");
      const quoteLine = verse.reference;

      const tokenize = (str) => str.split(/\s+/).map(t => t.trim()).filter(Boolean);

      const lineTokens = lines.map(tokenize);
      const quoteTokens = tokenize(quoteLine);

      const flat = [];
      lineTokens.forEach((arr, lineIdx) => {
        arr.forEach((tok, tokIdx) => {
          flat.push({ where:"body", lineIdx, tokIdx, tok });
        });
      });
      quoteTokens.forEach((tok, tokIdx) => {
        flat.push({ where:"quote", lineIdx: 999, tokIdx, tok });
      });

      const isMeaningful = (t) => {
        if (!t) return false;
        const pureSymbol = /^[\-\–—\(\)\[\]{}"“”'‘’.,!?]+$/.test(t);
        if (pureSymbol) return false;
        return t.replace(/[^\w가-힣:.-]/g,"").length >= 2;
      };

      const candidates = flat
        .map((x, idx) => ({...x, idx}))
        .filter(x => isMeaningful(x.tok));

      const pickCount = Math.min(blankCount, candidates.length);

      const picked = shuffle([...candidates]).slice(0, pickCount)
        .sort((a,b) => a.idx - b.idx)
        .map((x, order) => ({
          id: order,
          correct: x.tok,
          filled: null,
          meta: { idx: x.idx, where: x.where, lineIdx: x.lineIdx, tokIdx: x.tokIdx }
        }));

      const blankByFlatIdx = new Map();
      picked.forEach(b => blankByFlatIdx.set(b.meta.idx, b.id));

      return {
        verseId: verse.id,
        topic: verse.topic,
        reference: verse.reference,
        bodyLines: lines,
        lineTokens,
        quoteTokens,
        flat,
        blanks: picked,
        blankByFlatIdx,
        active: 0,
        completed: false,
        dimmedWrong: new Set(),
      };
    }

    function renderQuiz(){
      const quizEl = document.getElementById("screen-quiz");
      if (!quizEl || !quiz) return;

      const total = quiz.blanks.length;
      const done = quiz.blanks.filter(b => b.filled !== null).length;
      const progressPct = total === 0 ? 0 : Math.round((done/total)*100);
      const stepText = `${Math.min(done, total)}/${total}`;

      quizEl.innerHTML = `
        <div class="pt-2 pb-4">
          <div class="flex items-end justify-between">
            <div class="flex-1">
              <!-- ✅ 주제명 +3pt -->
              <div class="text-[27px] font-classic font-black text-mainFont/92 tracking-tight truncate">
                ${escapeHTML(quiz.topic)}
              </div>
            </div>

            <div class="w-[72px] text-right">
              <span class="text-[13px] font-sans font-black tracking-[0.08em] text-mainFont/45 tabular-nums">
                ${stepText}
              </span>
            </div>
          </div>

          <div class="quiz-progress-rail mt-3">
            <div class="quiz-progress-bar" style="width:${progressPct}%;"></div>
          </div>
        </div>

        <div style="height:4px;"></div>

        <div class="flex-1 flex flex-col">
          <div class="relative p-10 glass-card rounded-[3.5rem] border border-white/40 study-card-shadow flex flex-col justify-center items-center min-h-[440px]">
            <div class="w-full text-center">
              ${renderQuizBodyHTML()}
              ${renderQuizQuoteHTML()}
            </div>
          </div>
        </div>

        <div class="mt-8 pb-8" id="quiz-choice-area">
          ${renderChoiceAreaHTML()}
        </div>
      `;

      lucide.createIcons();
      bindChoiceHandlers();

      const choiceArea = document.getElementById("quiz-choice-area");
      if (choiceArea && (quiz.completed || quiz.active >= quiz.blanks.length)) {
        requestAnimationFrame(() => choiceArea.classList.add("is-collapsed"));
      }
    }

    function renderQuizBodyHTML(){
      let html = "";
      let flatIdx = 0;

      quiz.lineTokens.forEach((tokens) => {
        const lineParts = tokens.map((tok) => {
          const id = quiz.blankByFlatIdx.get(flatIdx);
          const blank = (id !== undefined) ? quiz.blanks[id] : null;

          const isActive = blank && id === quiz.active;
          const isFilled = blank && blank.filled !== null;

          const out = blank
            ? `<span class="quiz-blank ${isFilled ? "is-filled" : ""} ${isActive && !isFilled ? "is-active" : ""}">${isFilled ? escapeHTML(blank.correct) : ""}</span>`
            : escapeHTML(tok);

          flatIdx++;
          return out;
        }).join(" ");

        html += `<p class="text-[1.7rem] font-serif font-bold leading-[1.9] text-mainFont break-keep">${lineParts}</p>`;
      });

      return html;
    }

    function renderQuizQuoteHTML(){
      const bodyTokenCount = quiz.lineTokens.reduce((acc, arr) => acc + arr.length, 0);
      let flatIdx = bodyTokenCount;

      const parts = quiz.quoteTokens.map((tok) => {
        const id = quiz.blankByFlatIdx.get(flatIdx);
        const blank = (id !== undefined) ? quiz.blanks[id] : null;

        const isActive = blank && id === quiz.active;
        const isFilled = blank && blank.filled !== null;

        const out = blank
          ? `<span class="quiz-blank ${isFilled ? "is-filled" : ""} ${isActive && !isFilled ? "is-active" : ""}">${isFilled ? escapeHTML(blank.correct) : ""}</span>`
          : escapeHTML(tok);

        flatIdx++;
        return out;
      }).join(" ");

      /* ✅ 인용구절 텍스트 크기 = 본문 텍스트 크기(1.7rem) 통일 */
      return `
        <p class="mt-10 text-[1.7rem] font-serif font-bold leading-[1.9] text-mainFont break-keep">
          ${parts}
        </p>
      `;
    }

    function renderChoiceAreaHTML(){
      if (quiz.active >= quiz.blanks.length){
        quiz.completed = true;
        return ``;
      }

      const activeBlank = quiz.blanks[quiz.active];
      const choices = generateChoices(activeBlank.correct);

      return `
        <div class="grid grid-cols-2 gap-3">
          ${choices.map((w, idx) => {
            const key = `c_${quiz.active}_${idx}_${w}`;
            const dim = quiz.dimmedWrong.has(key) ? "is-dimmed" : "";
            return `
              <button class="choice-btn clickable-element ${dim}"
                      data-choice="${escapeAttr(w)}"
                      data-key="${escapeAttr(key)}">
                <span class="choice-label">${escapeHTML(w)}</span>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function bindChoiceHandlers(){
      const area = document.getElementById("quiz-choice-area");
      if (!area) return;

      area.querySelectorAll("button[data-choice]").forEach(btn => {
        btn.addEventListener("click", function(){
          if (quiz.completed) return;

          const choice = this.getAttribute("data-choice");
          const key = this.getAttribute("data-key");
          const activeBlank = quiz.blanks[quiz.active];
          if (!activeBlank) return;

          if (choice !== activeBlank.correct){
            quiz.dimmedWrong.add(key);
            this.classList.add("is-dimmed");
            return;
          }

          this.classList.add("is-correct");

          setTimeout(() => {
            activeBlank.filled = activeBlank.correct;
            quiz.active += 1;
            renderQuiz();
          }, 120);
        });
      });
    }

    function generateChoices(correct){
      const unique = new Set();
      unique.add(correct);

      const classify = (w) => {
        const numRef = /^\d{1,2}:\d{1,2}(-\d{1,2})?$/.test(w);
        const hasBook = /(복음|전서|후서|서|시편|잠언|고린도|요한|로마|갈라디아|에베소|빌립보|골로새)/.test(w);
        if (numRef) return "numRef";
        if (hasBook) return "book";
        if (/^[0-9]+$/.test(w)) return "number";
        if (/^[가-힣]+$/.test(w)) return "korean";
        return "other";
      };

      const type = classify(correct);
      const targetLen = correct.length;

      const verseWords = Array.from(new Set(
        (currentVerse.content.replace(/\n/g," ").split(/\s+/).map(s=>s.trim()).filter(Boolean))
          .concat(currentVerse.reference.split(/\s+/).map(s=>s.trim()).filter(Boolean))
      ));

      let pool = [];

      if (type === "numRef"){
        pool = ["1:1","1:9","3:5-6","5:11-12","10:13","16:24","10:9","11:4","4:7","2:8"];
      } else if (type === "book"){
        pool = ["요한복음","요한일서","요한계시록","고린도전서","고린도후서","로마서","시편","잠언","에베소서","빌립보서","골로새서"];
      } else if (type === "korean"){
        pool = verseWords
          .filter(w => classify(w) === "korean")
          .filter(w => Math.abs(w.length - targetLen) <= 1);

        if (pool.length < 6){
          pool = pool.concat(["영생","은혜","생명","믿음","구원","말씀","기쁨","확신","사랑","죄","자백","의로","인정","신뢰","지도"]);
        }
      } else {
        pool = verseWords.slice();
      }

      pool = pool.filter(w => w && w !== correct);
      shuffle(pool);

      for (const w of pool){
        if (unique.size >= 4) break;
        unique.add(w);
      }

      const fallback = ["영생","은혜","생명","믿음","구원","말씀","기쁨","사랑","확신","인도","사죄","승리","기도","자백","의로"];
      shuffle(fallback);
      for (const w of fallback){
        if (unique.size >= 4) break;
        if (w !== correct) unique.add(w);
      }

      let arr = Array.from(unique);
      if (!arr.includes(correct)) arr.unshift(correct);
      arr = arr.slice(0,4);

      const fixed = [];
      const seen = new Set();
      for (const w of arr){
        if (!seen.has(w) && fixed.length < 4){
          fixed.push(w); seen.add(w);
        }
      }
      while (fixed.length < 4){
        const w = fallback.find(x => x !== correct && !seen.has(x)) || "말씀";
        fixed.push(w); seen.add(w);
      }
      if (!fixed.includes(correct)) fixed[0] = correct;
      return shuffle(fixed);
    }

    function shuffle(arr){
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function escapeHTML(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function escapeAttr(str){
      return escapeHTML(str).replaceAll("\n"," ");
    }

    document.addEventListener("DOMContentLoaded", () => {
      initTopics();
      initNavigation();
      lucide.createIcons();
      restartGardenAnim();
    });
  </script>
